<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MOS Browser</title>
  <link rel="prefetch" href="/scram/scramjet.worker.js"/>
  <link rel="prefetch" href="/scram/scramjet.shared.js"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      --bg:        #07100a;
      --surface:   #0b160e;
      --surface2:  #111f14;
      --surface3:  #182b1c;
      --gold:      #7a9e7e;
      --gold2:     #a3c9a8;
      --text:      #ceefd4;
      --text-dim:  #4a6650;
      --text-mid:  #8aaa90;
      --mono:      'Space Mono', monospace;
      --sans:      'Space Grotesk', sans-serif;
      --border:    rgba(122,158,126,0.12);
      --border-hi: rgba(122,158,126,0.28);
      --red:       #ff6b6b;
      --fourth-bg: var(--surface2);
      --hover-bg:  var(--surface3);
      --active-bg: rgba(122,158,126,0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body, html, #app {
      font-family: var(--sans);
      width: 100vw; height: 100vh;
      background: var(--bg);
      overflow: hidden;
      color: var(--text);
    }

    /* ── Animations ─────────────────────────────────────────────────── */
    @keyframes fade {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    @keyframes slideIn { from { transform: translateX(-16px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ── Layout utils ────────────────────────────────────────────────── */
    .flex { display: flex; }
    .col  { flex-direction: column; }
    .centered { justify-content: center; align-items: center; }

    /* ── Browser container ───────────────────────────────────────────── */
    .browser-container {
      width: 100%; height: 100%;
      color: var(--text);
      display: flex; flex-direction: column;
      padding: 0.4em 0.4em 0;
      box-sizing: border-box;
      background: var(--bg);
      position: relative;
    }

    /* subtle hex-grid background texture */
    .browser-container::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 15% 15%, rgba(122,158,126,0.06) 0%, transparent 50%),
        radial-gradient(circle at 85% 85%, rgba(122,158,126,0.04) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }
    .browser-container > * { position: relative; z-index: 1; }

    /* ── Tabs ────────────────────────────────────────────────────────── */
    .tabs {
      padding: 0.4rem 0 0;
      gap: 3px;
      overflow-x: auto; overflow-y: hidden;
      white-space: nowrap;
      animation: slideIn 0.4s ease;
      flex-shrink: 0;
    }
    .tabs::-webkit-scrollbar { height: 3px; }
    .tabs::-webkit-scrollbar-track { background: transparent; }
    .tabs::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

    .tab {
      color: var(--text-dim);
      outline: none; border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      background: var(--surface2);
      padding: 0.45rem 0.9rem;
      width: 200px; min-width: 140px;
      overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; flex-shrink: 0;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
      position: relative;
    }
    .tab:hover:not(.active) { background: var(--surface3); color: var(--text-mid); border-color: var(--border-hi); }
    .tab.active {
      background: var(--bg); color: var(--gold);
      border-color: var(--border-hi);
    }
    .tab-favicon { width: 13px; height: 13px; flex-shrink: 0; border-radius: 2px; opacity: 0.8; }
    .tab-title   { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-close {
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; padding: 0; width: 16px; height: 16px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 3px; flex-shrink: 0; font-size: 13px;
      transition: color 0.12s, background 0.12s;
    }
    .tab-close:hover { color: var(--red); background: rgba(255,107,107,0.1); }

    .new-tab {
      color: var(--text-dim); outline: none; border: 1px solid var(--border);
      border-bottom: none; border-radius: 6px 6px 0 0;
      background: var(--surface2);
      padding: 0; width: 32px; height: 32px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 18px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .new-tab:hover { background: var(--surface3); color: var(--gold); border-color: var(--border-hi); }

    /* ── Nav / toolbar ───────────────────────────────────────────────── */
    .nav {
      padding: 0.5rem 0;
      gap: 5px;
      animation: slideIn 0.4s ease;
      align-items: center;
      z-index: 3; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
    }

    .nav button {
      color: var(--text-dim); outline: none; border: 1px solid var(--border);
      border-radius: 6px; background: var(--surface2);
      padding: 0; width: 32px; height: 32px;
      cursor: pointer; font-size: 13px;
      box-shadow: none;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .nav button:hover { background: var(--surface3); color: var(--text); border-color: var(--border-hi); }
    .nav button:active { transform: scale(0.94); animation: pulse 0.15s ease; }

    input.bar {
      font-family: var(--mono);
      padding: 0.5rem 1.6rem; border: 1px solid var(--border);
      outline: none; color: var(--text);
      height: 32px; border-radius: 6px; flex: 1;
      background: var(--surface2); font-size: 11px;
      letter-spacing: 0.06em;
      transition: border-color 0.15s, background 0.15s;
    }
    input.bar::placeholder { color: var(--text-dim); }
    input.bar:focus { border-color: var(--border-hi); background: var(--surface3); outline: none; }

    /* ── Go button ───────────────────────────────────────────────────── */
    #go-btn-toolbar {
      padding: 0 14px; height: 32px; flex-shrink: 0;
      background: var(--gold); color: #000; border: none;
      border-radius: 6px; font-family: var(--mono); font-size: 10px;
      font-weight: 700; letter-spacing: 0.12em; cursor: pointer;
      transition: background 0.15s;
    }
    #go-btn-toolbar:hover { background: var(--gold2); }

    /* ── Iframe container ────────────────────────────────────────────── */
    .iframe-container {
      flex: 1; position: relative;
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 6px 6px;
      overflow: hidden; margin-top: 0;
    }
    .iframe-container iframe {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border: none; background: #fff;
    }
    .iframe-container iframe.hidden { display: none; }

    /* ── Settings dialog ─────────────────────────────────────────────── */
    .cfg {
      background: var(--surface2); color: var(--text);
      border-radius: 10px; padding: 1.4rem;
      max-width: 480px; width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      border: 1px solid var(--border-hi);
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .cfg[open] { animation: fade 0.25s ease; }
    .cfg::backdrop { backdrop-filter: blur(8px); background: rgba(7,16,10,0.7); }
    .cfg h2 {
      margin: 0 0 1rem; font-size: 13px; font-family: var(--mono);
      color: var(--gold); text-align: center; letter-spacing: 0.2em;
    }

    .buttons { gap: 6px; margin-bottom: 1rem; justify-content: center; flex-wrap: wrap; }
    .buttons button {
      border: 1px solid var(--border); background: var(--surface3);
      border-radius: 6px; color: var(--text-mid);
      padding: 6px 14px; cursor: pointer;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
      transition: all 0.15s;
    }
    .buttons button:hover { background: var(--gold); color: #000; border-color: var(--gold); }

    .input_row { margin-bottom: 0.8rem; margin-top: 0.4rem; }
    .input_row label { font-size: 9px; color: var(--text-dim); letter-spacing: 0.14em; margin-bottom: 4px; display: block; font-family: var(--mono); }
    .input_row input {
      background: var(--surface3); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); outline: none;
      padding: 0.6rem 0.8rem; font-size: 11px; width: 100%;
      font-family: var(--mono); transition: border-color 0.15s;
    }
    .input_row input:focus { border-color: var(--border-hi); }

    /* ── Menu dropdown ───────────────────────────────────────────────── */
    .menu-btn { position: relative; }
    .menu-dropdown {
      display: none;
      position: absolute; top: calc(100% + 6px); right: 0;
      background: var(--surface2); border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      border: 1px solid var(--border-hi);
      z-index: 1000; min-width: 190px; padding: 4px 0;
    }
    .menu-dropdown button {
      width: 100%; border-radius: 0; background: none; border: none;
      padding: 8px 14px; text-align: left;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
      color: var(--text-mid);
      display: flex; align-items: center; gap: 10px;
      transition: background 0.12s, color 0.12s;
    }
    .menu-dropdown button:hover { background: var(--surface3); color: var(--text); }
    .menu-dropdown.show { display: block; animation: fade 0.2s ease; }
    .menu-dropdown button i { width: 14px; text-align: center; flex-shrink: 0; }
    .menu-dropdown .zoom-controls { justify-content: center; width: 100%; gap: 10px; padding: 8px 14px; }
    .menu-sep { height: 1px; background: var(--border); margin: 3px 0; }

    /* ── History modal ───────────────────────────────────────────────── */
    .history-modal {
      background: var(--surface2); color: var(--text);
      border-radius: 10px; padding: 1.4rem;
      max-width: 560px; width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      border: 1px solid var(--border-hi);
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    .history-modal[open] { animation: fade 0.25s ease; }
    .history-modal::backdrop { backdrop-filter: blur(8px); background: rgba(7,16,10,0.7); }
    .history-modal h2 { font-family: var(--mono); font-size: 12px; color: var(--gold); letter-spacing: 0.2em; margin-bottom: 1rem; text-align: center; }
    .history-item {
      padding: 7px 10px; border-bottom: 1px solid var(--border);
      cursor: pointer; font-family: var(--mono); font-size: 10px;
      color: var(--text-mid); transition: background 0.12s, color 0.12s;
      border-radius: 4px;
    }
    .history-item:hover { background: var(--surface3); color: var(--text); }
    .history-item small { color: var(--text-dim); display: block; margin-top: 2px; }

    /* ── Zoom controls ───────────────────────────────────────────────── */
    .zoom-controls {
      display: flex; align-items: center;
      justify-content: center; gap: 8px; padding: 7px 14px;
    }
    .zoom-controls button {
      width: 26px !important; height: 26px !important;
      border-radius: 5px !important; background: var(--surface3) !important;
      border: 1px solid var(--border) !important; color: var(--text-mid) !important;
      font-size: 13px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s; padding: 0 !important;
    }
    .zoom-controls button:hover { background: var(--gold) !important; color: #000 !important; }
    .zoom-controls span { font-family: var(--mono); font-size: 10px; color: var(--text-mid); min-width: 36px; text-align: center; }

    /* ── Sortable ────────────────────────────────────────────────────── */
    .sortable-ghost { opacity: 0.4 !important; transform: scale(0.95); }
    .sortable-drag  { transform: rotate(1deg) scale(1.02); background: var(--active-bg) !important; }

    /* ── Suggestion list ─────────────────────────────────────────────── */
    .suggestion-list {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--surface2); border-radius: 0 0 8px 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid var(--border-hi); border-top: none;
      z-index: 1000; max-height: 260px; overflow-y: auto;
      display: none; flex-direction: column; padding: 4px;
    }
    .suggestion-list::-webkit-scrollbar { width: 4px; }
    .suggestion-list::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

    .search-section  { margin-bottom: 4px; }
    .search-title {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px; font-size: 9px; color: var(--text-dim);
      font-family: var(--mono); letter-spacing: 0.12em;
    }
    .search-title img { width: 14px; height: 14px; border-radius: 2px; opacity: 0.6; }
    .search-results { display: flex; flex-direction: column; }
    .search-results div {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 10px; cursor: pointer;
      font-family: var(--mono); font-size: 10px;
      color: var(--text-mid); letter-spacing: 0.04em;
      border-radius: 4px; transition: background 0.1s, color 0.1s;
    }
    .search-results div:hover, .search-results div.selected { background: var(--surface3); color: var(--text); }
    .search-results div i { font-size: 10px; color: var(--text-dim); width: 12px; }
    .suggestion-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── New tab page ────────────────────────────────────────────────── */
    .mos-newtab {
      position: absolute; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; z-index: 5;
    }
    .mos-newtab.hidden { display: none; }

    .nt-logo { color: var(--gold); margin-bottom: 4px; }
    .nt-os-name {
      font-family: var(--mono); font-size: 20px; font-weight: 700;
      letter-spacing: 0.22em; color: var(--text); margin-bottom: 2px;
    }
    .nt-os-name span { color: var(--gold); }
    .nt-os-sub {
      font-family: var(--mono); font-size: 9px;
      color: var(--text-dim); letter-spacing: 0.28em;
      margin-top: -10px;
    }
    .nt-divider { width: 44px; height: 1px; background: var(--border-hi); margin: 2px 0; }

    .nt-search-wrap { display: flex; gap: 8px; width: 480px; max-width: 92vw; }
    #nt-search {
      flex: 1; background: var(--surface2); border: 1px solid var(--border-hi);
      border-radius: 8px; padding: 11px 14px;
      color: var(--text); font-family: var(--mono); font-size: 12px;
      outline: none; transition: border-color 0.15s; user-select: text;
      letter-spacing: 0.04em;
    }
    #nt-search:focus { border-color: var(--gold); }
    #nt-search::placeholder { color: var(--text-dim); }
    #nt-go {
      background: var(--gold); color: #000; border: none;
      border-radius: 8px; padding: 0 22px;
      font-family: var(--mono); font-size: 11px; font-weight: 700;
      cursor: pointer; letter-spacing: 0.1em; transition: background 0.12s;
    }
    #nt-go:hover { background: var(--gold2); }

    .nt-engine-row {
      display: flex; gap: 6px; align-items: center;
      font-family: var(--mono); font-size: 9px;
      color: var(--text-dim); letter-spacing: 0.08em; margin-top: -6px;
    }
    .nt-engine-btn {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 4px; padding: 3px 9px;
      font-family: var(--mono); font-size: 9px;
      color: var(--text-dim); cursor: pointer;
      transition: all 0.12s; letter-spacing: 0.06em;
    }
    .nt-engine-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }
    .nt-engine-btn:hover:not(.active) { color: var(--text); border-color: var(--border-hi); }

    .nt-links {
      display: flex; gap: 7px; flex-wrap: wrap;
      justify-content: center; max-width: 520px;
    }
    .nt-link {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 7px; padding: 8px 14px;
      font-family: var(--mono); font-size: 9px;
      color: var(--text-mid); cursor: pointer;
      letter-spacing: 0.06em; transition: all 0.12s;
    }
    .nt-link:hover { background: var(--surface3); color: var(--text); border-color: var(--border-hi); }

    .nt-note {
      font-family: var(--mono); font-size: 9px; color: var(--text-dim);
      letter-spacing: 0.06em; text-align: center; max-width: 420px; line-height: 1.9;
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

    ::selection { color: #000; background: var(--gold); }
  </style>
</head>
<body>
<div id="app"></div>

<script src="/baremux/index.js"></script>
<script src="/scram/scramjet.controller.js"></script>
<script src="/config.js"></script>

<script>
"use strict";

// ── Scramjet init ─────────────────────────────────────────────────────────────
const scramjet = new ScramjetController({
  files: {
    wasm:   "/scram/scramjet.wasm.wasm",
    worker: "/scram/scramjet.worker.js",
    client: "/scram/scramjet.client.js",
    shared: "/scram/scramjet.shared.js",
    sync:   "/scram/scramjet.sync.js",
  },
});
scramjet.init();
navigator.serviceWorker.register("./sw.js");

const connection = new BareMux.BareMuxConnection("/baremux/worker.js");

const store = {
  url:      "https://",
  wispurl:  _CONFIG?.wispurl  || (location.protocol === "https:" ? "wss"   : "ws")   + "://" + location.host + "/wisp/",
  bareurl:  _CONFIG?.bareurl  || (location.protocol === "https:" ? "https" : "http") + "://" + location.host + "/bare/",
  homepage: "mos://newtab",
  history:  JSON.parse(localStorage.getItem("mos_browserHistory") || "[]"),
  zoomLevel: 1,
  engine:   localStorage.getItem("mos_engine") || "bing",
};

connection.setTransport("/epoxy/index.mjs", [{ wisp: store.wispurl }]);

// ── Engines ───────────────────────────────────────────────────────────────────
const ENGINES = {
  bing: q => "https://www.bing.com/search?q=" + encodeURIComponent(q),
  ddg:  q => "https://duckduckgo.com/?q=" + encodeURIComponent(q) + "&ia=web",
};

function setEngine(name) {
  store.engine = name;
  localStorage.setItem("mos_engine", name);
  document.querySelectorAll(".nt-engine-btn").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById("eng-" + name);
  if (btn) btn.classList.add("active");
}

// ── Tab state ─────────────────────────────────────────────────────────────────
let tabs = [], activeTabId = null, nextTabId = 2, sortableInstance = null;

function getFaviconUrl(url) {
  try {
    const domain = new URL(url).origin;
    return `https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodeURIComponent(domain)}`;
  } catch { return ""; }
}

function createTab(url = store.homepage) {
  const frame = scramjet.createFrame();
  const tab = {
    id:        nextTabId++,
    title:     "New Tab",
    url,
    frame,
    favicon:   getFaviconUrl(url),
    zoomLevel: store.zoomLevel,
  };

  // load
  if (url === store.homepage) {
    frame.frame.src = "about:blank";
  } else {
    frame.frame.src = url;
  }

  frame.frame.style.transform       = `scale(${tab.zoomLevel})`;
  frame.frame.style.transformOrigin = "0 0";
  frame.frame.style.width           = `${100 / tab.zoomLevel}%`;
  frame.frame.style.height          = `${100 / tab.zoomLevel}%`;

  frame.addEventListener("urlchange", e => {
    if (!e.url) return;
    tab.url    = e.url;
    tab.favicon = getFaviconUrl(e.url);
    try {
      const title = frame.frame.contentWindow?.document?.title || new URL(e.url).hostname;
      tab.title = title || "…";
    } catch { tab.title = new URL(e.url).hostname || "…"; }

    if (e.url !== store.homepage) {
      store.history.push({ url: e.url, title: tab.title, timestamp: new Date() });
      localStorage.setItem("mos_browserHistory", JSON.stringify(store.history));
    }

    // notify MOS parent
    notifyParent(e.url);
    updateTabsUI();
    updateAddressBar();
    hideNewtab();
  });

  tabs.push(tab);
  return tab;
}

function getActiveTab()   { return tabs.find(t => t.id === activeTabId); }

function switchTab(tabId) {
  // hide all frames
  tabs.forEach(t => { if (t.frame?.frame) t.frame.frame.classList.add("hidden"); });
  activeTabId = tabId;
  const tab = getActiveTab();
  if (tab?.frame?.frame) tab.frame.frame.classList.remove("hidden");

  updateTabsUI();
  updateAddressBar();

  // show/hide newtab page
  if (!tab || tab.url === store.homepage) {
    showNewtab();
  } else {
    hideNewtab();
  }
}

function closeTab(tabId) {
  const idx = tabs.findIndex(t => t.id === tabId);
  if (idx === -1) return;
  const tab = tabs[idx];
  if (tab.frame?.frame?.parentNode) tab.frame.frame.parentNode.removeChild(tab.frame.frame);
  try { if (typeof tab.frame.destroy === "function") tab.frame.destroy(); } catch(e) {}
  tabs.splice(idx, 1);

  if (tabs.length === 0) {
    addNewTab();
  } else if (activeTabId === tabId) {
    switchTab(tabs[Math.min(idx, tabs.length - 1)].id);
  }
  updateTabsUI();
}

function addNewTab(url) {
  const tab = createTab(url || store.homepage);
  const ic  = document.getElementById("iframe-container");
  if (ic) ic.appendChild(tab.frame.frame);
  switchTab(tab.id);
  updateTabsUI();
  if (!url || url === store.homepage) {
    showNewtab();
    setTimeout(() => document.getElementById("nt-search")?.focus(), 80);
  }
}

// ── New tab page helpers ───────────────────────────────────────────────────────
function showNewtab() {
  const el = document.getElementById("mos-newtab");
  if (el) el.classList.remove("hidden");
}
function hideNewtab() {
  const el = document.getElementById("mos-newtab");
  if (el) el.classList.add("hidden");
}

// ── Tab bar render ────────────────────────────────────────────────────────────
function updateTabsUI() {
  const container = document.getElementById("tabs-container");
  if (!container) return;
  container.innerHTML = "";

  tabs.forEach((tab, idx) => {
    if (!tab?.frame) return;
    const el = document.createElement("div");
    el.className = "tab" + (tab.id === activeTabId ? " active" : "");
    el.setAttribute("data-tab-id", tab.id);
    el.onclick = () => switchTab(tab.id);
    el.style.animationDelay = `${idx * 0.05}s`;

    const fav = document.createElement("img");
    fav.className = "tab-favicon";
    fav.src = tab.favicon;
    fav.alt = "";
    fav.onerror = () => { fav.style.display = "none"; };
    if (tab.url === store.homepage) fav.style.display = "none";

    const titleSpan = document.createElement("span");
    titleSpan.className = "tab-title";
    titleSpan.textContent = tab.title;

    const closeBtn = document.createElement("button");
    closeBtn.className = "tab-close";
    closeBtn.innerHTML = "×";
    closeBtn.onclick = e => { e.stopPropagation(); closeTab(tab.id); };

    el.appendChild(fav);
    el.appendChild(titleSpan);
    el.appendChild(closeBtn);
    container.appendChild(el);
  });

  const newTabBtn = document.createElement("button");
  newTabBtn.className = "new-tab";
  newTabBtn.textContent = "+";
  newTabBtn.title = "New Tab";
  newTabBtn.onclick = () => addNewTab();
  container.appendChild(newTabBtn);

  // Sortable
  if (sortableInstance) sortableInstance.destroy();
  sortableInstance = new Sortable(container, {
    animation: 250,
    direction: "horizontal",
    ghostClass: "sortable-ghost",
    dragClass: "sortable-drag",
    filter: ".new-tab",
    onStart: () => container.querySelectorAll(".tab:not(.sortable-ghost)").forEach(t => t.style.opacity = "0.5"),
    onEnd:   evt => {
      container.querySelectorAll(".tab").forEach(t => t.style.opacity = "1");
      if (evt.oldIndex !== evt.newIndex) {
        const moved = tabs.splice(evt.oldIndex, 1)[0];
        tabs.splice(evt.newIndex, 0, moved);
      }
    },
  });
}

// ── Address bar ───────────────────────────────────────────────────────────────
function updateAddressBar() {
  const bar = document.getElementById("address-bar");
  const tab = getActiveTab();
  if (bar && tab) bar.value = (tab.url === store.homepage) ? "" : tab.url;
}

function navigate() {
  const tab = getActiveTab();
  const bar = document.getElementById("address-bar");
  if (!tab || !bar) return;

  let url = bar.value.trim();
  if (!url) return;

  if (!url.startsWith("http") && !url.includes(".")) {
    url = ENGINES[store.engine](url);
  } else if (!url.startsWith("http") && !url.startsWith("mos://")) {
    url = "https://" + url;
  }

  tab.url    = url;
  tab.favicon = getFaviconUrl(url);
  hideNewtab();
  return tab.frame.go(url);
}

function ntNavigate() {
  const v = document.getElementById("nt-search")?.value.trim();
  if (!v) return;
  document.getElementById("nt-search").value = "";

  let url = v;
  if (!url.startsWith("http") && !url.includes(".")) {
    url = ENGINES[store.engine](url);
  } else if (!url.startsWith("http")) {
    url = "https://" + url;
  }

  const tab = getActiveTab();
  if (tab) {
    tab.url    = url;
    tab.favicon = getFaviconUrl(url);
    hideNewtab();
    tab.frame.go(url);
    updateAddressBar();
  }
}

// ── Settings/menu helpers ─────────────────────────────────────────────────────
function showConfig() { document.getElementById("config-modal").showModal(); }
function closeConfig() {
  const m = document.getElementById("config-modal");
  m.style.opacity = "0";
  m.style.transition = "opacity 0.2s";
  setTimeout(() => { m.close(); m.style.opacity = ""; m.style.transition = ""; }, 220);
}

function toggleMenu() { document.getElementById("menu-dropdown").classList.toggle("show"); }
function closeMenu()  { document.getElementById("menu-dropdown").classList.remove("show"); }

function closeAllTabs() {
  tabs.forEach(tab => {
    if (tab.frame?.frame?.parentNode) tab.frame.frame.parentNode.removeChild(tab.frame.frame);
    try { if (typeof tab.frame.destroy === "function") tab.frame.destroy(); } catch(e) {}
  });
  tabs = [];
  addNewTab();
}

function zoomIn() {
  const tab = getActiveTab();
  if (!tab) return;
  tab.zoomLevel = Math.min(tab.zoomLevel + 0.1, 2);
  tab.frame.frame.style.transform = `scale(${tab.zoomLevel})`;
  tab.frame.frame.style.width     = `${100 / tab.zoomLevel}%`;
  tab.frame.frame.style.height    = `${100 / tab.zoomLevel}%`;
  const el = document.getElementById("zoom-level");
  if (el) el.textContent = Math.round(tab.zoomLevel * 100) + "%";
}
function zoomOut() {
  const tab = getActiveTab();
  if (!tab) return;
  tab.zoomLevel = Math.max(tab.zoomLevel - 0.1, 0.5);
  tab.frame.frame.style.transform = `scale(${tab.zoomLevel})`;
  tab.frame.frame.style.width     = `${100 / tab.zoomLevel}%`;
  tab.frame.frame.style.height    = `${100 / tab.zoomLevel}%`;
  const el = document.getElementById("zoom-level");
  if (el) el.textContent = Math.round(tab.zoomLevel * 100) + "%";
}

function toggleFullScreen() {
  const ic = document.getElementById("iframe-container");
  if (!document.fullscreenElement) ic?.requestFullscreen();
  else document.exitFullscreen();
}

function clearHistory() {
  store.history = [];
  localStorage.removeItem("mos_browserHistory");
}

function showHistory() {
  const modal    = document.getElementById("history-modal");
  const listEl   = document.getElementById("history-list");
  if (!modal || !listEl) return;
  listEl.innerHTML = store.history.slice().reverse().map(item =>
    `<div class="history-item" onclick="addNewTab('${item.url}'); document.getElementById('history-modal').close();">
      <span>${item.title || item.url}</span>
      <small>${item.url} · ${new Date(item.timestamp).toLocaleString()}</small>
    </div>`
  ).join("") || '<div style="padding:10px;font-family:var(--mono);font-size:10px;color:var(--text-dim)">No history yet.</div>';
  modal.showModal();
}

// ── MOS parent communication ───────────────────────────────────────────────────
let __PAR = null;
try { if (window.parent && window.parent !== window) __PAR = window.parent; } catch(e) {}

function notifyParent(url) {
  if (!__PAR) return;
  try { __PAR.postMessage({ type: "mos-url-update", url }, "*"); } catch(e) {}
}

// listen for mos-navigate from the OS
window.addEventListener("message", e => {
  if (!e.data || typeof e.data !== "object") return;
  if (e.data.type === "mos-navigate" && e.data.url) {
    const tab = getActiveTab();
    if (tab) {
      tab.url = e.data.url;
      hideNewtab();
      tab.frame.go(e.data.url);
      updateAddressBar();
    }
  }
});

// ── Suggestion search class ───────────────────────────────────────────────────
class Search {
  constructor() {
    this.currentSectionIndex = 0;
    this.maxResults = 8;
    this.sections = {};
    this.selectedIndex = -1;
  }

  init() {
    const bar  = document.getElementById("address-bar");
    const nav  = document.querySelector(".nav");
    const list = document.createElement("div");
    list.id = "suggestion-list";
    list.className = "suggestion-list";
    // insert after url bar's parent
    bar.parentNode.style.position = "relative";
    bar.parentNode.appendChild(list);

    this.sections = {
      searchResults: this.createSection("SEARCH RESULTS"),
      history:       this.createSection("HISTORY"),
    };
    Object.values(this.sections).forEach(({ section }) => list.appendChild(section));

    bar.addEventListener("input", async e => {
      list.style.display = "flex";
      const query = e.target.value.trim();
      if (!query) { this.clear(); list.style.display = "none"; return; }
      const suggestions = await this.fetchSuggestions(query);
      this.clear();
      this.populate(suggestions, query);
    });

    bar.addEventListener("keydown", e => {
      if (e.key === "Escape") { list.style.display = "none"; this.clear(); return; }
      const items = this.currentItems();
      const n     = items.length;
      if (e.key === "ArrowDown") {
        e.preventDefault();
        this.selectedIndex = (this.selectedIndex + 1) % n || 0;
        this.updateSelected();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        this.selectedIndex = (this.selectedIndex - 1 + n) % n;
        this.updateSelected();
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (this.selectedIndex >= 0) {
          bar.value = items[this.selectedIndex].querySelector(".suggestion-text").textContent;
        }
        this.clear(); list.style.display = "none"; navigate();
      }
    });

    document.addEventListener("click", e => {
      if (!bar.contains(e.target) && !list.contains(e.target)) {
        list.style.display = "none"; this.clear();
      }
    });
  }

  createSection(label) {
    const section = document.createElement("div");
    section.className = "search-section";
    const title = document.createElement("div");
    title.className = "search-title";
    title.innerHTML = `<i class="fas fa-hex" style="opacity:.5;font-size:9px"></i><span>${label}</span>`;
    const results = document.createElement("div");
    results.className = "search-results";
    section.appendChild(title);
    section.appendChild(results);
    return { section, results };
  }

  async fetchSuggestions(query) {
    try {
      const r = await fetch(`/results/${encodeURIComponent(query)}`);
      if (!r.ok) return [];
      const d = await r.json();
      return d.map(i => i.phrase);
    } catch { return []; }
  }

  populate(suggestions, query) {
    // search results
    const { results: sr, section: ss } = this.sections.searchResults;
    if (suggestions.length > 0) {
      ss.style.display = "block";
      suggestions.slice(0, this.maxResults).forEach(s => sr.appendChild(this.item(s)));
    } else { ss.style.display = "none"; }

    // history
    const { results: hr, section: hs } = this.sections.history;
    const lq = query.toLowerCase();
    const filtered = store.history.filter(h =>
      h.url?.toLowerCase().includes(lq) || h.title?.toLowerCase().includes(lq)
    ).slice(0, this.maxResults);
    if (filtered.length > 0) {
      hs.style.display = "block";
      filtered.forEach(h => hr.appendChild(this.item(h.url, h.title)));
    } else { hs.style.display = "none"; }
  }

  item(url, label = url) {
    const bar  = document.getElementById("address-bar");
    const list = document.getElementById("suggestion-list");
    const d = document.createElement("div");
    d.innerHTML = `<i class="fas fa-search"></i><span class="suggestion-text">${label}</span>`;
    d.onclick = () => {
      bar.value = url;
      this.clear(); list.style.display = "none"; navigate();
    };
    return d;
  }

  clear() {
    Object.values(this.sections).forEach(({ results, section }) => {
      results.innerHTML = ""; section.style.display = "none";
    });
    this.selectedIndex = -1;
  }

  currentItems() {
    return Object.values(this.sections)[this.currentSectionIndex].results.querySelectorAll("div");
  }

  updateSelected() {
    document.querySelectorAll(".search-results div.selected").forEach(el => el.classList.remove("selected"));
    const items = this.currentItems();
    if (items[this.selectedIndex]) items[this.selectedIndex].classList.add("selected");
  }
}
